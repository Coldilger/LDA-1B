# Cheap A/B probe for the SECOND gripper-masking fix (episode-level presence,
# uncommitted in lda/dataloader/gr00t_lerobot/datasets.py as of 2026-07-29),
# before committing to a full from-scratch retrain.
#
# The finished bridge_finetune run (150k steps, final_model/pytorch_model.pt)
# was trained with the FIRST fix only (e3bfce4, per-window presence check),
# which RESULTS.md shows left the gripper head at correlation ~+0.1 -- inside
# noise (70k/90k/100k bounced -0.124..+0.104 with no trend). The second fix
# (per-episode presence check) targets a residual: 16.5% of 16-step windows
# are constant-closed and were still getting masked out as "absent" by the
# first fix. Untested by any actual training so far.
#
# This config resumes from the FINISHED run's weights (good position/rotation
# already) but points at `final_model/pytorch_model.pt`, not a
# `steps_NNNNN_pytorch_model.pt` file -- train_LDA.py's checkpoint loader
# (train_LDA.py:242) only parses `completed_steps` from the latter filename
# pattern; failing that regex it falls back to completed_steps=0. That gives a
# FRESH short cosine schedule instead of resuming at the original run's
# already-decayed-to-min_lr point, while still starting from good weights.
#
# max_train_steps is ~1/19 of the full 150000-step budget. Same dataset/tag/
# architecture as LDA_bridge.yaml in every other respect, so the only variable
# versus the finished run is (a) fewer steps and (b) the second masking fix
# being active in the dataloader.
#
# After this finishes, run eval/bridge/diag_gripper.py --with-history
# --n-samples 200 on each saved checkpoint here and compare correlation/
# accuracy against the finished run's noise band (RESULTS.md: 70k +0.091/55.0%,
# 90k -0.124/42.5%, 100k +0.104/55.5%, n=200 at the last). Clearly and
# repeatably outside that band => the second fix is doing real work, worth a
# full retrain (or just extending this run). Inside the band => look elsewhere
# before spending a full retrain's compute.

run_id: bridge_griptest
run_root_dir: outputs/lda_bridge_griptest
seed: 42
trackers: [jsonl, wandb]
wandb_entity: null
wandb_project: lda-bridge-griptest
is_debug: false

framework:
  name: QwenMMDiT
  qwenvl:
    base_vlm: pretrained/vlm/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2

  action_model:
    action_model_type: DiT-L
    hidden_size: 2560
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 138
    state_dim: null
    action_horizon: 16
    future_action_window_size: 15
    past_action_window_size: 0
    obs_horizon: 2
    num_views: 1
    future_obs_index: 5
    max_num_embodiments: 32
    num_target_vision_tokens: 32
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    obs_loss_weight: 1.0
    only_policy: false
    only_wo_video_gen: false
    policy_and_video_gen: false
    vision_encoder_type: dinov3
    vision_encoder_size: s
    vision_encoder_path: pretrained
    diffusion_model_cfg:
      cross_attention_dim: 2560
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 2560
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /mnt/beegfsnew/scratch/3295540/data
    data_mix: bridge_lda
    lerobot_version: v2.0
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    image_size: [224, 224]
    delete_pause_frame: false
    use_delta_action: true
    training_task_weights: [1, 1, 1, 1]
    per_device_batch_size: 16

trainer:
  # Load the FINISHED run's final weights, not the original LDA-pretrain --
  # this test is only about whether the second masking fix moves the gripper
  # head, not about relearning position/rotation from scratch.
  pretrained_checkpoint: outputs/lda_bridge/bridge_finetune/final_model/pytorch_model.pt
  freeze_modules: 'qwen_vl_interface,action_model.vision_encoder'
  # Extended from the original 8000-step probe (which decisively fixed the
  # isolated gripper-correlation metric but left closed-loop success at 0%) to
  # give the rest of the policy time to recoordinate around the now-correct
  # gripper signal. is_resume=True (set at launch) picks up the existing
  # steps_8000 checkpoint and continues; this only changes the horizon the
  # cosine schedule is computed over.
  max_train_steps: 40000
  num_warmup_steps: 300
  save_interval: 5000
  eval_interval: 1000
  logging_frequency: 100
  learning_rate:
    base: 4.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  repeated_diffusion_steps: 1
  max_grad_norm: 1.0
  gradient_clipping: 1.0
  gradient_accumulation_steps: 6
  weight_decay: 0.0
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-05
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
